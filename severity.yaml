# harm_if_missed — the clinical judgment this product encodes.
#
# ############################################################################
# THIS FILE IS THE ONLY HUMAN-AUDITABLE SAFEGUARD IN THE SYSTEM.
#
# There is no dataset, no calibration, and no eval anywhere downstream. No
# metric will catch a wrong entry here. This file alone decides what gets
# flagged as life-threatening and what can be ticked off the panel.
#
# A CLINICIAN MUST REVIEW IT BEFORE THIS TOUCHES A REAL PATIENT.
# Drafted from published emergency-medicine "can't miss" lists. Unreviewed.
# ############################################################################
#
# ORDERS OF MAGNITUDE, NOT A LINEAR 1-5. Missing an MI is ~100x worse than
# missing a sore throat, not 5x. On a linear scale a likely benign condition
# outranks a rare lethal one and the panel quietly starts agreeing with the
# doctor.
#
# tiers:
#   100  lethal or irreversible within hours if missed
#    30  organ- or life-threatening over days; major morbidity
#    10  significant morbidity; needs definite treatment
#     3  needs treatment, not urgent
#     1  self-limiting
#
# Derive the tier from time-to-irreversible-harm and be ready to say so.
#
# Common benign conditions are rated explicitly rather than omitted, so that
# "unrated" honestly means "we have no entry for this" and not "this is
# probably fine."
#
# TWO INVARIANTS, both enforced by selftest.py:
#   1. Every condition at severity >= 10 MUST have an excluded_by entry.
#      If it can reach the panel, it must be able to leave. The previous
#      version violated this for 19 of 37 eligible conditions -- including
#      one at severity 100 -- which meant the panel could never be finished.
#   2. excluded_by never auto-removes. It proposes; the clinician confirms.

default: null   # null, not 3 -- an unlisted condition is UNRATED, not benign.

pathologies:

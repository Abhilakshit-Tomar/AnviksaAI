# Spelled-out names for the entries above that are written as acronyms.
#
# Not clinical judgment — naming only. A model writes "Systemic lupus
# erythematosus flare" as often as "SLE", and the two share no words at all,
# so the panel rated the first as UNRATED while rating the second correctly.
# Same defect class as the spelling and qualifier mismatches engine.match()
# already handles, and same consequence: a condition quietly losing its
# severity band and its exclusion rule over how it happened to be written.
#
# Only add an entry here when it is the SAME condition under another name.
# Anything that needs a judgment call about whether two names mean the same
# thing belongs in the list above, with a severity of its own.
aliases:
  SLE: "Systemic lupus erythematosus"
  PSVT: "Paroxysmal supraventricular tachycardia"
  GERD: "Gastro-oesophageal reflux disease"
  URTI: "Upper respiratory tract infection"
  "HIV (initial infection)": "Human immunodeficiency virus"
  "Diabetic ketoacidosis": "DKA"
  "Acute kidney injury": "AKI"
  "Subarachnoid haemorrhage": "SAH"
  "Deep vein thrombosis": "DVT"
  "Pulmonary embolism": "PE"
  "Urinary tract infection": "UTI"
  "Acute COPD exacerbation": "COPD exacerbation"

# What action would take a condition OFF the Can't-Miss panel.
#
# This is the fix for alert fatigue, and the difference between a safety net
# and a smoke alarm that goes off when you make toast. Without it, PE and ACS
# appear on every chest complaint forever and the doctor stops reading the
# panel within a week. The panel answers "what haven't you ruled out" -- a
# question that must be able to be FINISHED.
#
# THESE DO NOT AUTO-REMOVE. Recording one of these actions prompts the
# clinician to confirm the exclusion. A wrong entry here would otherwise
# silently delete a warning, which is the one error shape in this system
# that looks like patient harm rather than noise.
excluded_by:
  # --- cardiac / vascular ---
  "Possible NSTEMI / STEMI":            [ecg, troponin]
  "Unstable angina":                    [ecg, troponin]
  "Aortic dissection":                  [ct_angiogram_chest, ted_echo]
  "Ruptured abdominal aortic aneurysm": [usg_abdomen, ct_abdomen]
  "Pulmonary embolism":                 [d_dimer, ctpa, wells_documented]
  "Cardiac tamponade":                  [echo]
  "Acute pulmonary edema":              [cxr, bnp, echo]
  "Spontaneous pneumothorax":           [cxr, auscultation_documented]
  "Tension pneumothorax":               [cxr, needle_decompression_response]
  Myocarditis:                          [ecg, troponin, echo]
  Pericarditis:                         [ecg, echo]
  "Atrial fibrillation":                [ecg]
  PSVT:                                 [ecg]
  "Stable angina":                      [ecg, tmt]
  "Deep vein thrombosis":               [doppler_leg, d_dimer]

  # --- neurological ---
  "Subarachnoid haemorrhage":  [ct_head, lumbar_puncture]
  "Acute stroke / TIA":        [ct_head, mri_brain]
  "Bacterial meningitis":      [lumbar_puncture]
  Encephalitis:                [lumbar_puncture, mri_brain]

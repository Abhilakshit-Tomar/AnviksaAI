      ask: "Have you started any new medicine recently?"

# ============================================================================
# INVESTIGATIONS — human-readable labels for the exclusion tokens.
#
# severity.yaml's excluded_by lists tokens like `ctpa` and `d_dimer`. They are
# NOT findings: nobody asks a patient whether they have a CTPA. They are
# actions the clinician records, and every one of them needs a label before
# the panel can print "Mark Pulmonary embolism as ruled out? (CT pulmonary
# angiogram, D-dimer, documented Wells score)".
#
# Kept here, next to the vocabulary, so there is one place that names things
# and so selftest.py can assert that no exclusion token is unlabelled. An
# unlabelled token would render as a raw identifier in the one prompt in this
# system that removes a warning from the screen.
# ============================================================================
